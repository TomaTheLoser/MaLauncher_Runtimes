name: Build iOS JRE 21

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout JDK 21
        uses: actions/checkout@v4
        with:
          repository: openjdk/jdk21u
          path: jdk21u

      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          repository: TomaTheLoser/Jdk_ios
          path: jdk_ios
          ref: fix/master_pacthes_jre21

      - name: Apply patches with fuzz
        working-directory: jdk21u
        run: |
          git apply --reject --verbose ../jdk_ios/patches/jre_21/ios/jdk21u_ios.diff || true
          
      - name: Fix Awt2dLibraries.gmk rejects
        working-directory: jdk21u
        run: |
          REJ_FILE="make/modules/java.desktop/lib/Awt2dLibraries.gmk.rej"
          TARGET_FILE="make/modules/java.desktop/lib/Awt2dLibraries.gmk"
          if [ -f "$REJ_FILE" ]; then
            sed -i '' 's/ifeq (\$(call isTargetOs, macosx), true)/ifeq (\$(call isTargetOs, macosx_NOTIOS), true)/' "$TARGET_FILE"
            rm -f "$REJ_FILE"
          fi

      - name: Fix signals_posix.cpp rejects
        working-directory: jdk21u
        run: |
          REJ_FILE="src/hotspot/os/posix/signals_posix.cpp.rej"
          TARGET_FILE="src/hotspot/os/posix/signals_posix.cpp"
          if [ -f "$REJ_FILE" ]; then
            sed -i '' '/^#include <signal.h>/a\
          #include "os_bsd.hpp"\
          #include <sys/mman.h>
          ' "$TARGET_FILE"
            rm -f "$REJ_FILE"
          fi

      - name: Fix flags-cflags.m4 corrupted by patch
        working-directory: jdk21u
        run: |
          FILE="make/autoconf/flags-cflags.m4"
          if grep -q 'JVM_BUILDJDK" = true' "$FILE"; then
            sed -i '' 's/&& "\$JVM_BUILDJDK" = true/&& test "\$JVM_BUILDJDK" = true/' "$FILE"
          fi

      - name: Verify no remaining rejects
        working-directory: jdk21u
        run: |
          if find . -name "*.rej" | grep -q .; then
            echo "WARNING: Some rejects remain:"
            find . -name "*.rej"
          else
            echo "All rejects resolved!"
          fi

      - name: Install build dependencies
        run: |
          brew install autoconf freetype

      - name: Download and setup CUPS headers
        working-directory: jdk21u
        run: |
          curl -L -o cups.tar.gz https://github.com/apple/cups/releases/download/v2.2.4/cups-2.2.4-source.tar.gz
          tar xzf cups.tar.gz
          # Find the cups source directory
          CUPS_SRC=$(find . -maxdepth 2 -name "cups.h" -type f | head -1 | xargs dirname)
          echo "Found cups.h in: $CUPS_SRC"
          # Create proper include structure
          mkdir -p cups-fake/include/cups
          cp $CUPS_SRC/*.h cups-fake/include/cups/ 2>/dev/null || true
          # Also look for ppd.h
          PPD_DIR=$(find . -maxdepth 3 -name "ppd.h" -type f | head -1 | xargs dirname)
          if [ -n "$PPD_DIR" ]; then
            mkdir -p cups-fake/include/cups
            cp $PPD_DIR/ppd.h cups-fake/include/cups/
          fi
          # Create a fake ppd.h if missing
          if [ ! -f cups-fake/include/cups/ppd.h ]; then
            touch cups-fake/include/cups/ppd.h
          fi
          echo "CUPS fake dir contents:"
          find cups-fake -type f

      - name: Configure OpenJDK
        working-directory: jdk21u
        run: |
          bash configure \
            --openjdk-target=aarch64-apple-ios \
            --with-sysroot=$(xcrun --sdk iphoneos --show-sdk-path) \
            --with-toolchain-type=clang \
            --disable-warnings-as-errors \
            --with-cups=$(pwd)/cups-fake \
            --with-freetype=bundled \
            --with-extra-cflags="-miphoneos-version-min=15.0" \
            --with-extra-cxxflags="-miphoneos-version-min=15.0" \
            --with-extra-ldflags="-miphoneos-version-min=15.0"

      - name: Build JRE
        working-directory: jdk21u
        run: |
          make jre-image

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre-ios-21
          path: jdk21u/build/*/images/jre
