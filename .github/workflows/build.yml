name: Build iOS JRE 21

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout JDK 21
        uses: actions/checkout@v4
        with:
          repository: openjdk/jdk21u
          path: jdk21u

      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          repository: TomaTheLoser/Jdk_ios
          path: jdk_ios
          ref: fix/master_pacthes_jre21

      - name: Apply patches with fuzz
        working-directory: jdk21u
        run: |
          git apply --reject --verbose ../jdk_ios/patches/jre_21/ios/jdk21u_ios.diff || true
          
      - name: Fix Awt2dLibraries.gmk rejects
        working-directory: jdk21u
        run: |
          REJ_FILE="make/modules/java.desktop/lib/Awt2dLibraries.gmk.rej"
          TARGET_FILE="make/modules/java.desktop/lib/Awt2dLibraries.gmk"
          if [ -f "$REJ_FILE" ]; then
            sed -i '' 's/ifeq (\$(call isTargetOs, macosx), true)/ifeq (\$(call isTargetOs, macosx_NOTIOS), true)/' "$TARGET_FILE"
            rm -f "$REJ_FILE"
          fi

      - name: Fix signals_posix.cpp rejects
        working-directory: jdk21u
        run: |
          REJ_FILE="src/hotspot/os/posix/signals_posix.cpp.rej"
          TARGET_FILE="src/hotspot/os/posix/signals_posix.cpp"
          if [ -f "$REJ_FILE" ]; then
            sed -i '' '/^#include <signal.h>/a\
          #include "os_bsd.hpp"\
          #include <sys/mman.h>
          ' "$TARGET_FILE"
            rm -f "$REJ_FILE"
          fi

      - name: Fix flags-cflags.m4 corrupted by patch
        working-directory: jdk21u
        run: |
          FILE="make/autoconf/flags-cflags.m4"
          if grep -q 'JVM_BUILDJDK" = true' "$FILE"; then
            sed -i '' 's/&& "\$JVM_BUILDJDK" = true/&& test "\$JVM_BUILDJDK" = true/' "$FILE"
          fi

      - name: Disable hotspot agent (breaks on iOS)
        working-directory: jdk21u
        run: |
          FILE="make/modules/jdk.hotspot.agent/Gensrc.gmk"
          sed -i '' 's/^/#DISABLED_/' "$FILE"

      - name: Fix os_perf_bsd.cpp for iOS (remove missing includes)
        working-directory: jdk21u
        run: |
          FILE="src/hotspot/os/bsd/os_perf_bsd.cpp"
          # Remove include of libproc.h (not on iOS)
          sed -i '' 's|#import <libproc.h>|// iOS: no libproc.h|' "$FILE"
          # Remove include of net/route.h (not on iOS)
          sed -i '' 's|#include <net/route.h>|// iOS: no route.h|' "$FILE"
          # Replace PROC_ALL_PIDS with 1 (dummy value)
          sed -i '' 's|PROC_ALL_PIDS|1|g' "$FILE"
          # Replace PROC_PIDPATHINFO_MAXSIZE with 4096
          sed -i '' 's|PROC_PIDPATHINFO_MAXSIZE|4096|g' "$FILE"
          # Replace proc_listpids with stub returning 0
          sed -i '' 's|proc_listpids|proc_listpids_stub|g' "$FILE"
          # Replace proc_pidpath with stub
          sed -i '' 's|proc_pidpath|proc_pidpath_stub|g' "$FILE"
          # Add stubs at top after includes
          sed -i '' '/^#include/a\
          \
          static int proc_listpids_stub(uint32_t type, uint32_t typeinfo, void* buffer, int buffersize) { return 0; }\
          static int proc_pidpath_stub(int pid, void* buffer, uint32_t buffersize) { return 0; }' "$FILE"

      - name: Nuke all X11-dependent Java files
        working-directory: jdk21u
        run: |
          rm -f src/java.desktop/unix/classes/sun/awt/X11FontManager.java
          rm -f src/java.desktop/unix/classes/sun/font/NativeGlyphMapper.java
          rm -f src/java.desktop/unix/classes/sun/font/MFontConfiguration.java

      - name: Verify no remaining rejects
        working-directory: jdk21u
        run: |
          if find . -name "*.rej" | grep -q .; then
            echo "WARNING: Some rejects remain:"
            find . -name "*.rej"
          else
            echo "All rejects resolved!"
          fi

      - name: Install build dependencies
        run: |
          brew install autoconf freetype

      - name: Download and setup CUPS headers
        run: |
          cd /tmp
          curl -L -o cups.tar.gz https://github.com/apple/cups/releases/download/v2.2.4/cups-2.2.4-source.tar.gz
          tar xzf cups.tar.gz
          EXTRACTED_DIR=$(ls -d cups-* 2>/dev/null | head -1)
          mkdir -p /tmp/cups-fake/include/cups
          find $EXTRACTED_DIR -name "*.h" -exec cp {} /tmp/cups-fake/include/cups/ \;
          if [ ! -f /tmp/cups-fake/include/cups/ppd.h ]; then
            touch /tmp/cups-fake/include/cups/ppd.h
          fi

      - name: Configure OpenJDK
        working-directory: jdk21u
        run: |
          bash configure \
            --openjdk-target=aarch64-apple-ios \
            --with-sysroot=$(xcrun --sdk iphoneos --show-sdk-path) \
            --with-toolchain-type=clang \
            --disable-warnings-as-errors \
            --with-cups=/tmp/cups-fake \
            --with-freetype=bundled \
            --with-extra-cflags="-miphoneos-version-min=15.0" \
            --with-extra-cxxflags="-miphoneos-version-min=15.0" \
            --with-extra-ldflags="-miphoneos-version-min=15.0"

      - name: Build JDK
        working-directory: jdk21u
        run: |
          make images

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdk-ios-21
          path: jdk21u/build/*/images/jdk
